[package]
name = "mikomai"
version = "0.1.0"
description = "Managed Infrastructure Knowledge Operator of Ml Agent Interface."
authors = ["NAKAOKU Takahiro"]
license = "MIT"
edition = "2021"
default-run = "mikomai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mikomai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
llama-cpp-2 = { version = "0.1.153", features = ["mtmd"] }
lancedb = "0.27.2"
fastembed = "4"
arrow = "57"
arrow-array = "57"
arrow-json = "57"
reqwest = { version = "0.12.12", features = ["stream"] }
tokio = { version = "1.52.1", features = ["full"] }
futures = "0.3.32"
tauri-plugin-shell = "2.3.5"
surge-ping = "0.8.4"
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tokio-cron-scheduler = "0.15.1"
tauri-plugin-dialog = "2.7.1"
serialport = "4.7.0"
dns-lookup = "3.0.1"
regex = "1.12.3"
base64 = "0.22.1"
csv = "1.3"
aes-gcm = "0.10.3"
rand = "0.10.1"
ring = "0.17.14"
getrandom = "0.4.2"
rand_core = "0.10.1"
anyhow = "1.0.102"
validator = { version = "0.21.0", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4.22"
keyring = "4.0.1"
keyring-core = "1.0.0"
thiserror = "1.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "std", "fmt"] }
tracing-log = "0.2.0"
jsonrepair-rs = "0.2.1"
suppaftp = { version = "10.0.1", features = ["tokio"] }
async-tftp = "0.4.2"
surrealdb = { version = "=3.1.0", default-features = false, features = ["kv-rocksdb"] }



[dev-dependencies]
tauri = { version = "2", features = ["test"] }
