# ==============================================================================
# Netmiko ベンダー別 デフォルトコマンドテンプレート定義ファイル
# ==============================================================================
# 各コマンドは単一文字列（例: "show running-config"）のほか、
# 配列/リスト形式（例: ["show interface", "show ip status"] または YAML リスト）も指定可能です。
# 配列指定時は全コマンドが順次実行され、すべての実行が完了してから Mikomai に返されます。

cisco_ios:
  fetch_config: "show running-config"
  fetch_route: "show ip route"
  fetch_bgp: "show ip bgp summary"
  fetch_arp: "show ip arp"
  fetch_interfaces: "show interfaces"
  fetch_lldp: "show lldp neighbors"
  fetch_mac_table: "show mac address-table"
  fetch_ospf: "show ip ospf neighbor"
  fetch_cpu: "show processes cpu"

juniper_junos:
  fetch_config: "show configuration"
  fetch_route: "show route"
  fetch_bgp: "show bgp summary"
  fetch_arp: "show arp"
  fetch_interfaces: "show interfaces"
  fetch_lldp: "show lldp neighbors"
  fetch_mac_table: "show ethernet-switching table"
  fetch_ospf: "show ospf neighbor"
  fetch_cpu: "show system processes extensive | match CPU"

arista_eos:
  fetch_config: "show running-config"
  fetch_route: "show ip route"
  fetch_bgp: "show ip bgp summary"
  fetch_arp: "show ip arp"
  fetch_interfaces: "show interfaces"
  fetch_lldp: "show lldp neighbors"
  fetch_mac_table: "show mac address-table"
  fetch_ospf: "show ip ospf neighbor"
  fetch_cpu: "show processes top once"

yamaha:
  fetch_config: "show config"
  fetch_route: "show ip route"
  fetch_bgp: "show ip bgp summary"
  fetch_arp: "show arp"
  fetch_interfaces: ["show status lan1", "show status lan2", "show status wan1"]
  fetch_lldp: "show status lldp"
  fetch_mac_table: "show status switching-hub mac"
  fetch_ospf: "show ip ospf neighbor"
  fetch_cpu: "show status cpu"

furukawa_fitelnet:
  fetch_config: "show running-config"
  fetch_route: "show ip route"
  fetch_bgp: "show ip bgp summary"
  fetch_arp: "show ip arp"
  fetch_interfaces: "show interface"
  fetch_lldp: "show lldp neighbor"
  fetch_mac_table: "show mac-address-table"
  fetch_ospf: "show ip ospf neighbor"
  fetch_cpu: "show cpu"
