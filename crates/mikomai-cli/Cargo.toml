[package]
name = "mikomai-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
mikomai-core = { path = "../../mikomai-core" }
mikomai-adapters = { path = "../mikomai-adapters" }
mikomai-ffi = { path = "../mikomai-ffi" }
mikomai-llm-llamacpp = { path = "../mikomai-llm-llamacpp" }
futures-lite = "2"
serde_json = "1"
chrono = { version = "0.4.44", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
