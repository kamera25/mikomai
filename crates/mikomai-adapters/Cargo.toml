[package]
name = "mikomai-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
mikomai-core = { path = "../../mikomai-core" }
uuid = { version = "1", features = ["serde"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
chrono = { version = "0.4.44", features = ["serde"] }
surrealdb = { version = "=3.1.0", default-features = false, features = ["kv-rocksdb"] }
tokio = { version = "1.52.1", features = ["full"] }
serialport = { version = "4.7", default-features = false }
fastembed = "4"

mikomai-llm-llamacpp = { path = "../mikomai-llm-llamacpp" }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
mikomai-llm-apple = { path = "../mikomai-llm-apple" }

[dev-dependencies]
futures-lite = "2"
tokio = { version = "1.52.1", features = ["full"] }
